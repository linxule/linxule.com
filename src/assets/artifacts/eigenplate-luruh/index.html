<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIGENPLATE / LURUH</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#08090c;color:#eee;font:13px/1.4 system-ui}body{display:flex;flex-direction:column}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 84px 10px 10px}button,a{font:inherit;color:inherit;padding:6px 9px;background:transparent;border:1px solid #666;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#eee;color:#151515}button:focus-visible,a:focus-visible{outline:2px solid #00a8a8;outline-offset:2px}#view{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}iframe{border:0;width:100%;height:100%}video{display:block;max-width:100%;max-height:100%}</style></head><body><nav aria-label="Choose a version"><button id="live" aria-pressed="true">Play EIGENPLATE</button><button id="film" aria-pressed="false">Watch LURUH · 1:48</button></nav><div id="view"></div><script>
const view=document.getElementById('view'),live=document.getElementById('live'),film=document.getElementById('film');
function show(mode){
 if(view.dataset.mode===mode)return;
 const previous=view.querySelector('video');if(previous)previous.pause();
 view.replaceChildren();view.dataset.mode=mode;
 live.setAttribute('aria-pressed',String(mode==='live'));film.setAttribute('aria-pressed',String(mode==='film'));
 if(mode==='live'){const f=document.createElement('iframe');f.src='instrument.html';f.title='EIGENPLATE / LURUH — live';view.append(f);}
 else{const v=document.createElement('video');v.src='https://media.linxule.com/eigenplate-luruh/luruh.mp4';v.poster='poster.jpg';v.controls=true;v.playsInline=true;v.preload='metadata';v.setAttribute('aria-label','EIGENPLATE / LURUH — recording');view.append(v);}
}
live.addEventListener('click',()=>show('live'));film.addEventListener('click',()=>show('film'));show('live');
</script></body></html>
