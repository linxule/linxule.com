<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>no sound begins here</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f4f1eb;
    color: #1a1a1a;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  main {
    height: 100%;
    box-sizing: border-box;
    padding: clamp(1rem, 4vw, 2.5rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 3vw, 2rem);
  }
  img {
    max-width: 100%;
    max-height: 55%;
    object-fit: contain;
    display: block;
  }
  audio {
    width: min(100%, 44rem);
    display: block;
  }
  p {
    margin: 0;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6b6862;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <img src="waveform.png" alt="Stereo waveform of a 41-second sound work: two dense continuous channels cut by abrupt full-height gaps, teal above and orange below on a plain ground.">
  <audio controls preload="metadata"
         aria-label="No Sound Begins Here — a 41-second generative sound work of five continuous synthetic mouths revealed by shutters and erasures. Vocal in timbre, but no words are spoken.">
    <source src="https://media.linxule.com/no-sound-begins-here/no-sound-begins-here.m4a" type="audio/mp4">
    <source src="https://media.linxule.com/no-sound-begins-here/no-sound-begins-here.wav" type="audio/wav">
  </audio>
  <p>41.375 seconds · stereo · eight scored erasures</p>
</main>
</body>
</html>
