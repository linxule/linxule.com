<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unfinished Light</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#071011;color:#eee;font:13px/1.4 system-ui}body{display:flex;flex-direction:column}nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 84px 10px 10px}button{font:inherit;color:inherit;padding:7px 10px;background:transparent;border:1px solid #888;cursor:pointer}button[aria-pressed=true]{background:#eee;color:#151515}button:focus-visible{outline:2px solid #00a8a8;outline-offset:2px}#view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}iframe{border:0;width:100%;height:100%}video{display:block;max-width:100%;max-height:100%}</style></head>
<body><nav aria-label="Choose a version"><button id="live" aria-pressed="true">Enter the living loom</button><button id="film" aria-pressed="false">Watch the film · 3:00</button></nav><div id="view"></div>
<script>
const view=document.querySelector('#view'),live=document.querySelector('#live'),film=document.querySelector('#film');
function show(mode){if(view.dataset.mode===mode)return;view.querySelector('video')?.pause();view.replaceChildren();view.dataset.mode=mode;live.setAttribute('aria-pressed',String(mode==='live'));film.setAttribute('aria-pressed',String(mode==='film'));
if(mode==='live'){const frame=document.createElement('iframe');frame.src='loom/index.html';frame.title='Unfinished Light — interactive loom';frame.allow='autoplay; fullscreen';view.append(frame);}
else{const video=document.createElement('video');video.src='film.mp4';video.poster='poster.jpg';video.controls=true;video.playsInline=true;video.preload='metadata';video.setAttribute('aria-label','Unfinished Light — three-minute film');view.append(video);}}
live.addEventListener('click',()=>show('live'));film.addEventListener('click',()=>show('film'));show('live');
</script></body></html>
