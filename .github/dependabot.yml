version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # The sitemap checker reads Vercel's v6 route DSL. Semver update-type
    # ignores apply only to version updates; security updates stay enabled.
    ignore:
      - dependency-name: path-to-regexp
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
