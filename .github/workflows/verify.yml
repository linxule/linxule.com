name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/site-img
            node_modules/.cache/eleventy-img-fetch
          key: ${{ runner.os }}-eleventy-img-v2-${{ hashFiles('src/**/*.png', 'src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.webp', 'src/**/*.svg', 'eleventy/shortcodes.js', 'eleventy/transforms.js') }}
      - run: bun run build
      - run: bun run test:making
